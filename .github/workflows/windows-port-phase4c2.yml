name: Windows Port Phase 4C2

on:
  push:
    branches:
      - phase/04c-compression-bundle-parity
  workflow_dispatch:

jobs:
  compression-parity:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        shell: pwsh
        run: ./scripts/windows-preflight.ps1

      - name: Census
        shell: pwsh
        run: ./scripts/phase1-census.ps1 -OutputDirectory build/phase4c2-evidence

      - name: Configure
        shell: pwsh
        run: cmake -S windows -B build/windows-phase4c2

      - name: Build
        shell: pwsh
        run: cmake --build build/windows-phase4c2 --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/windows-phase4c2 -C Release --output-on-failure

      - name: Compression capability boundary
        shell: pwsh
        run: |
          $cli = Get-ChildItem build/windows-phase4c2 -Recurse -Filter vphone-cli-win.exe | Select-Object -First 1
          if (-not $cli) { throw "vphone-cli-win.exe not found" }

          $cap = ((& $cli.FullName archive-capabilities) -join [Environment]::NewLine) | ConvertFrom-Json

          foreach ($name in @("gzip","xz","zstd")) {
            if ($cap.$name -ne "supported") {
              throw "$name not supported"
            }
          }

          if ($cap.bundle_manifest_validation -ne "supported") { throw "bundle validation regressed" }
          if ($cap.windows_hardlink_identity -ne "supported") { throw "hardlink identity regressed" }
          if ($cap.symlink_import -ne "unsupported") { throw "symlink import must remain unsupported" }
          if ($cap.darwin_xattrs_acl -ne "unsupported") { throw "Darwin metadata must remain unsupported" }
