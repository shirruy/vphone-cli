name: Windows Port Phase 4D3E

on:
  push:
    branches:
      - phase/04d3e-udif-adc-decode
  workflow_dispatch:

jobs:
  udif-adc-decode:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Phase 4D3E validator
        shell: pwsh
        run: ./scripts/phase4d3e-validation.ps1
