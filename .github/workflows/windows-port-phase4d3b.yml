name: Windows Port Phase 4D3B

on:
  push:
    branches:
      - phase/04d3b-udif-zlib-decode
  workflow_dispatch:

jobs:
  udif-zlib-decode:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Phase 4D3B validator
        shell: pwsh
        run: ./scripts/phase4d3b-validation.ps1
