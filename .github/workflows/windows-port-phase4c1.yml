name: Windows Port Phase 4C1

on:
  push:
    branches:
      - phase/04c-compression-bundle-parity
  workflow_dispatch:

jobs:
  bundle-parity:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        shell: pwsh
        run: ./scripts/windows-preflight.ps1

      - name: Census
        shell: pwsh
        run: ./scripts/phase1-census.ps1 -OutputDirectory build/phase4c1-evidence

      - name: Configure
        shell: pwsh
        run: cmake -S windows -B build/windows-phase4c1

      - name: Build
        shell: pwsh
        run: cmake --build build/windows-phase4c1 --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/windows-phase4c1 -C Release --output-on-failure

      - name: Bundle capability boundary
        shell: pwsh
        run: |
          $cli = Get-ChildItem build/windows-phase4c1 -Recurse -Filter vphone-cli-win.exe | Select-Object -First 1
          if (-not $cli) { throw "vphone-cli-win.exe not found" }

          $cap = ((& $cli.FullName archive-capabilities) -join [Environment]::NewLine) | ConvertFrom-Json

          if ($cap.bundle_manifest_validation -ne "supported") { throw "bundle validation not supported" }
          if ($cap.windows_hardlink_identity -ne "supported") { throw "hardlink identity not supported" }
          if ($cap.symlink_import -ne "unsupported") { throw "symlink import must remain unsupported" }

          foreach ($name in @("zstd","xz","gzip","darwin_xattrs_acl")) {
            if ($cap.$name -ne "unsupported") {
              throw "$name must remain unsupported without Phase 4C2 evidence"
            }
          }
