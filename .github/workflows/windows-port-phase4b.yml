name: Windows Port Phase 4B

on:
  push:
    branches:
      - phase/04b-archive-restore-parity
  workflow_dispatch:

jobs:
  archive-parity:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        shell: pwsh
        run: ./scripts/windows-preflight.ps1

      - name: Census
        shell: pwsh
        run: ./scripts/phase1-census.ps1 -OutputDirectory build/phase4b-evidence

      - name: Configure
        shell: pwsh
        run: cmake -S windows -B build/windows-phase4b

      - name: Build
        shell: pwsh
        run: cmake --build build/windows-phase4b --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/windows-phase4b -C Release --output-on-failure

      - name: Archive capability boundary
        shell: pwsh
        run: |
          $cli = Get-ChildItem build/windows-phase4b -Recurse -Filter vphone-cli-win.exe | Select-Object -First 1
          if (-not $cli) { throw "vphone-cli-win.exe not found" }

          $cap = ((& $cli.FullName archive-capabilities) -join [Environment]::NewLine) | ConvertFrom-Json
          if ($cap.gnutar_uncompressed -ne "supported") { throw "GNU tar not supported" }
          if ($cap.member_read -ne "supported") { throw "member read not supported" }

          foreach ($name in @("zstd","xz","gzip","darwin_xattrs_acl")) {
            if ($cap.$name -ne "unsupported") {
              throw "$name must remain unsupported without executable evidence"
            }
          }
