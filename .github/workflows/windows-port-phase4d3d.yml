name: Windows Port Phase 4D3D

on:
  push:
    branches:
      - phase/04d3d-udif-bzip2-decode
  workflow_dispatch:

jobs:
  udif-bzip2-decode:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Phase 4D3D validator
        shell: pwsh
        run: ./scripts/phase4d3d-validation.ps1
