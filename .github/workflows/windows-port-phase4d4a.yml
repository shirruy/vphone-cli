name: Windows Port Phase 4D4A

on:
  push:
    branches:
      - phase/04d4a-fixed-vhd-attach-convert
  workflow_dispatch:

jobs:
  phase4d4a:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        shell: pwsh
        run: cmake -S .\windows -B .\build\windows-phase4d4a-ci

      - name: Build
        shell: pwsh
        run: cmake --build .\build\windows-phase4d4a-ci --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir .\build\windows-phase4d4a-ci -C Release --output-on-failure

      - name: Verify fixed VHD capability remains fail-closed until physical promotion
        shell: pwsh
        run: |
          $cli = Get-ChildItem .\build\windows-phase4d4a-ci -Filter vphone-cli-win.exe -File -Recurse | Select-Object -First 1
          if (-not $cli) { throw "vphone-cli-win.exe missing" }
          $cap = ((& $cli.FullName restore-capabilities) -join [Environment]::NewLine) | ConvertFrom-Json
          if ($cap.disk_image_fixed_vhd_convert -ne "supported") { throw "fixed VHD conversion missing" }
          if ($cap.disk_image_fixed_vhd_attach_readonly -ne "implemented_not_promoted") { throw "attach boundary changed unexpectedly" }
          if ($cap.disk_image_attach_convert -ne "unsupported") { throw "aggregate capability promoted prematurely" }
