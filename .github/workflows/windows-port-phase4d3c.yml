name: Windows Port Phase 4D3C

on:
  push:
    branches:
      - phase/04d3c-udif-lzfse-decode
  workflow_dispatch:

jobs:
  udif-lzfse-decode:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Phase 4D3C validator
        shell: pwsh
        run: ./scripts/phase4d3c-validation.ps1
