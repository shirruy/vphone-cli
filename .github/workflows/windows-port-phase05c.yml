name: Windows Port Phase 5C

on:
  push:
    branches:
      - phase/05c-apple-machine-model-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-apple-machine-model-foundation:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify exact commit
        shell: pwsh
        run: |
          git rev-parse HEAD
          git status --porcelain

      - name: Install pinned QEMU ARM64 provider
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://qemu.weilnetz.de/w64/2026/qemu-w64-setup-20260811.exe"

          $expected = "5bcf9eed634e8575a37b74f445af41a2fe4106da512d0c30c368301d4c105037fdfab40a5287367a28a957624cddebbc8c07e16c88ab6634f554cdf3d16bf543"

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            "qemu-w64.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          $actual = (
            Get-FileHash `
              $installer `
              -Algorithm SHA512
          ).Hash.ToLowerInvariant()

          if ($actual -ne $expected) {
            throw "QEMU SHA512 mismatch."
          }

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "QEMU installation failed."
          }

          $qemuDir = "C:\Program Files\qemu"

          if (-not (Test-Path "$qemuDir\qemu-system-aarch64.exe")) {
            throw "QEMU ARM64 binary missing."
          }

          $qemuDir |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

      - name: Phase 5C physical-equivalent validation
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & .\scripts\phase05c-apple-machine-model-validation.ps1

      - name: Upload Phase 5C evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase05c-apple-machine-model-${{ github.sha }}
          path: build/phase05c-apple-machine-model-evidence/
          if-no-files-found: error